<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="#f8fafc" rx="18" />
  
  <!-- Subtle Blueprint Grid Pattern -->
  <g stroke="#e2e8f0" stroke-width="0.8" opacity="0.6">
    <line x1="40" y1="0" x2="40" y2="480" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="280" y1="0" x2="280" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="520" y1="0" x2="520" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
    <line x1="760" y1="0" x2="760" y2="480" />
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="140" x2="800" y2="140" />
    <line x1="0" y1="220" x2="800" y2="220" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="380" x2="800" y2="380" />
    <line x1="0" y1="460" x2="800" y2="460" />
  </g>

  <!-- Industrial Header Banner -->
  <rect x="0" y="0" width="800" height="110" rx="18" fill="url(#headerGrad)" />
  <rect x="0" y="105" width="800" height="5" fill="#0d9488" />

  <!-- Technical Spec Badge -->
  <g transform="translate(60, 24)">
    <rect x="0" y="0" width="288" height="24" rx="12" fill="#0d9488" fill-opacity="0.25" stroke="#0d9488" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#0d9488" />
    <text x="24" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="0.5">Mütek PCD Streaming Current Model</text>
  </g>

  <!-- Titles -->
  <text x="60" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff">Zeta Potential &amp; Colloidal Charge Window</text>
  <text x="60" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">منحنى جهد زيتا (Zeta Potential) والنافذة المثالية للشحنة الغروية في العجينة</text>

  <!-- Technical Content Cards -->
  
    <g transform="translate(60, 150)">
      <rect x="0" y="0" width="680" height="78" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="8" height="78" rx="4" fill="#0d9488" />
      <circle cx="36" cy="39" r="16" fill="#0d9488" fill-opacity="0.12" />
      <text x="36" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0d9488" text-anchor="middle">1</text>
      <text x="68" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Anionic Trash Window</text>
      <text x="68" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Negative charge &lt; -25 mV leads to chemical waste and foam</text>
    </g>

    <g transform="translate(60, 245)">
      <rect x="0" y="0" width="680" height="78" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="8" height="78" rx="4" fill="#0d9488" />
      <circle cx="36" cy="39" r="16" fill="#0d9488" fill-opacity="0.12" />
      <text x="36" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0d9488" text-anchor="middle">2</text>
      <text x="68" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Optimal Window (-5 to -15 mV)</text>
      <text x="68" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Near-zero slightly anionic state ensures maximum chemical retention</text>
    </g>

    <g transform="translate(60, 340)">
      <rect x="0" y="0" width="680" height="78" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
      <rect x="0" y="0" width="8" height="78" rx="4" fill="#0d9488" />
      <circle cx="36" cy="39" r="16" fill="#0d9488" fill-opacity="0.12" />
      <text x="36" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0d9488" text-anchor="middle">3</text>
      <text x="68" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Overcationization Danger</text>
      <text x="68" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#475569">Positive charge &gt; 0 mV repels functional resins and creates sizing defects</text>
    </g>

  <!-- Footer Brand Mark -->
  <g transform="translate(60, 448)">
    <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#64748b">FREE TISSUE CAMP • INDUSTRIAL SCHEMATIC ASSET</text>
    <text x="680" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0d9488" text-anchor="end">ENGINEERING CERTIFIED</text>
  </g>
</svg>